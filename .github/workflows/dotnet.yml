name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Console-app-food-trailer-crew.Tests/Console-app-food-trailer-crew.Tests.csproj

      - name: Build
        run: dotnet build Console-app-food-trailer-crew.Tests/Console-app-food-trailer-crew.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Console-app-food-trailer-crew.Tests/Console-app-food-trailer-crew.Tests.csproj --no-build --configuration Release --verbosity normal